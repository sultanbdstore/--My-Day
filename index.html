 PN.forEach((p,i)=>{if(i===1)return;const d=a[i].getTime();[[d-S.pre*6e4,'b'],[d,'n']].forEach(([w,x])=>{const key=p+x;if(n>=w&&n<w+6e4*3&&!S.nf[key]){S.nf[key]=1;save();notify(t(p)+(x==='n'?' – '+t('pn'):' · '+dg(S.pre)+(S.lang==='bn'?' মিনিট বাকি':' min left')),hm(a[i]))}})});
 S.tasks.forEach(x=>{if(!x.done&&x.due===k&&x.tm){const w=new Date(k+'T'+x.tm).getTime();if(n>=w&&n<w+18e4&&!S.nf[x.id]){S.nf[x.id]=1;save();notify('⏰ '+x.t,hm(new Date(w)))}}});
 const ev=new Date();if(ev.getHours()===21&&ev.getMinutes()>=30&&ev.getMinutes()<34&&!S.nf.ev&&!perfect(k)&&units(k)[0]>0){S.nf.ev=1;save();notify('🔥 '+t('app'),t('ev'))}}
function act(a,el){const id=el&&el.dataset.id;
 if(a==='tab'){V.tab=el.dataset.k}
 else if(a==='lang')S.lang=S.lang==='bn'?'en':'bn';
 else if(a==='ft')V.f=el.dataset.f;
 else if(a==='wk'){V.tab='c';V.sel=el.dataset.k;V.cm=null}
 else if(a==='sd'){V.sel=el.dataset.k}
 else if(a==='mv'){const n=+el.dataset.n;let[y,m]=V.cm;m+=n;if(m<0){m=11;y--}if(m>11){m=0;y++}V.cm=[y,m]}
 else if(a==='gt'){V.sel=td();V.cm=null}
 else if(a==='pdk'){const k=el.dataset.k,p=S.pr[k]||(S.pr[k]=[0,0,0,0,0]),i=+el.dataset.i;p[i]=p[i]?0:1}
 else if(a==='dq'){const v=$('#dq').value.trim();if(!v)return;S.tasks.push({id:uid(),t:v,pri:2,due:V.sel,tm:'',done:0})}
 else if(a==='qa'){const v=$('#ti').value.trim();if(!v)return;S.tasks.push({id:uid(),t:v,pri:2,due:'',tm:'',done:0})}
 else if(a==='add'){V.tab==='h'?hform():tform();return}
 else if(a==='et'){tform(S.tasks.find(x=>x.id===id));return}
 else if(a==='st'){const v=$('#f1').value.trim();if(!v)return;const o={t:v,pri:+$('#f2').value,due:$('#f3').value,tm:$('#f4').value};if(V.E.id)Object.assign(V.E,o);else S.tasks.push({id:uid(),done:0,...o});close()}
 else if(a==='dt'){S.tasks=S.tasks.filter(x=>x!==V.E);close()}
 else if(a==='tk'){const x=S.tasks.find(y=>y.id===id);x.done=x.done?0:1}
 else if(a==='eh'){hform(S.habits.find(x=>x.id===id));return}
 else if(a==='dy'){const i=+el.dataset.i;V.hd[i]=V.hd[i]?0:1;el.classList.toggle('ok');return}
 else if(a==='tpl'){const x=t('tp')[el.dataset.i];$('#f1').value=x[1];$('#f2').value=x[0];V.hd=(x[2]||[1,1,1,1,1,1,1]).slice();document.querySelectorAll('#dy button').forEach((b,i)=>b.classList.toggle('ok',!!V.hd[i]));return}
 else if(a==='sh'){const v=$('#f1').value.trim();if(!v)return;if(V.E.id){Object.assign(V.E,{n:v,ic:$('#f2').value,days:V.hd.slice()})}else S.habits.push({id:uid(),n:v,ic:$('#f2').value,days:V.hd.slice(),log:{}});close()}
 else if(a==='dh'){if(!confirm('?'))return;S.habits=S.habits.filter(x=>x!==V.E);close()}
 else if(a==='hd'){const h=S.habits.find(x=>x.id===id),k=el.dataset.d;h.log[k]?delete h.log[k]:h.log[k]=1;if(el.dataset.m){el.classList.toggle('ok');save();return}}
 else if(a==='pd'){const k=td(),p=S.pr[k]||(S.pr[k]=[0,0,0,0,0]),i=+el.dataset.i;p[i]=p[i]?0:1}
 else if(a==='gps'){if(!navigator.geolocation)return toast('GPS ✗');navigator.geolocation.getCurrentPosition(p=>{S.loc={n:'GPS',e:'GPS',la:p.coords.latitude,lo:p.coords.longitude,g:1};save();render()},()=>toast('GPS ✗'));return}
 else if(a==='ics'){ics();return}
 else if(a==='bk'){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='my-day-backup.json';l.click();return}
 else if(a==='rs'){$('#rf').click();$('#rf').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(x=>{const o=JSON.parse(x);if(!Array.isArray(o.tasks))throw 0;S={...S,...o};save();render();toast('✓')}).catch(()=>toast('✗'))};return}
 else if(a==='inst'&&dI){dI.prompt();dI=null;$('#inst').hidden=true;return}
 else if(a==='close'){close();return}
 const pn=perfect(td());if(pn&&!V.pf)toast(t('pf'));V.pf=pn;save();render()}
document.addEventListener('click',e=>{if(e.target.classList.contains('mb'))return close();const b=e.target.closest('[data-a]');if(b&&b.tagName!=='INPUT')act(b.dataset.a,b)});
document.addEventListener('change',e=>{const x=e.target;if(x.id==='ct'){const c=CITY[+x.value];S.loc={n:c[0],e:c[1],la:c[2],lo:c[3]}}else if(x.id==='pt')S.pt=x.checked?1:0;else if(x.id==='ex'){x.checked?S.ex[td()]=1:delete S.ex[td()]}
 else if(x.id==='rm'){S.rem=x.checked?1:0;if(S.rem&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission()}else if(x.id==='pre')S.pre=+x.value||0;else if(x.id==='ho')S.ho=+x.value;else if(x.id==='ws')S.ws=+x.value;else if(x.id==='bg')S.big=x.checked?1:0;else if(x.dataset.a==='aj')S.adj[+x.dataset.i]=+x.value||0;else return;save();render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='ti')act('qa');else if(e.target.id==='dq')act('dq')}});
let dI;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dI=e;$('#inst').hidden=false});
V.pf=perfect(td());render();setInterval(()=>{tick();if(V.tab==='t'&&!$('#md').innerHTML)render()},20000);tick();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
